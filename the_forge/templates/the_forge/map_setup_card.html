{% extends 'the_keep/base.html' %}
{% load static %}

{% block title %}Setup Card - {{ faction.faction_name }} | {% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 820px;">
  <div class="d-flex justify-content-between align-items-center mb-3">

    <a href="{{ cancel_url }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Map</a>

  {% include 'the_keep/includes/map_setup_card_editor.html' %}
</div>
{% endblock %}
